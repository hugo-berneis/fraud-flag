spring:
  application:
    name: fraud-flag
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:fraudflag}
    username: ${POSTGRES_USER:fraudflag}
    password: ${POSTGRES_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-flag-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fraudflag.transaction
        spring.json.value.default.type: com.fraudflag.transaction.Transaction
        spring.json.use.type.headers: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    distribution:
      percentiles:
        "[fraudflag.decision.latency]": 0.5,0.95
      percentiles-histogram:
        "[fraudflag.decision.latency]": true

fraudflag:
  thresholds:
    tau-low: 0.3
    tau-high: 0.7
    file: thresholds.json
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
